global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "johnrahmadi-model-serving"
    metrics_path: /monitoring/prometheus/metrics
    static_configs:
      # Ganti <URL_DEPLOYMENT> dengan domain hasil deploy di Railway/Heroku
      # contoh: johnrahmadi-churn.up.railway.app
      - targets: ["<URL_DEPLOYMENT>:<PORT>"]
